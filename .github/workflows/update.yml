name: Update AltStore Source

on:
  schedule:
    # 每天 UTC 00:00 与 12:00 各运行一次（对应北京时间 08:00 和 20:00）
    - cron: "0 0,12 * * *"
  workflow_dispatch: {} # 支持手动触发
  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "scripts/process.py"

permissions:
  contents: read

concurrency:
  group: update-source
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 每次运行都按最新配置全量重新生成 all-apps.json（覆盖旧文件）。
      # all-apps.json 是生成产物，不提交回仓库；生成失败（非零退出码）会使本步骤失败，
      # 从而让整个 workflow 失败，起到配置/源可用性告警的作用。
      - name: Regenerate all-apps.json
        run: python3 scripts/process.py
